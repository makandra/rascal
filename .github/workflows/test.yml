name: Tests
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - ruby: '3.0'
          gemfile: Gemfile
          # The Bundler in Gemfile.lock needs Ruby 3.1, so use the one Ruby 3.0 comes with.
          bundler: none
        - ruby: '3.3'
          gemfile: Gemfile
        - ruby: '3.4'
          gemfile: Gemfile
        - ruby: '4.0'
          gemfile: Gemfile
    env:
      BUNDLE_GEMFILE: "${{ matrix.gemfile }}"
    steps:
    - uses: actions/checkout@v4
    - name: Install ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler: "${{ matrix.bundler || 'default' }}"
    - name: Bundle
      run: |
        gem install bundler:2.1.4
        bundle install --no-deployment
    - name: Run tests
      run: bundle exec rake
